name: Release Foundry VTT System

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build system
        run: npm run build

      - name: Build system.zip
        run: |
          zip -r system.zip . -x ".git/*" -x ".github/*" -x ".gitignore" -x "node_modules/*"

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            system.zip
            system.json